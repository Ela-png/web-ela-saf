<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ela SAF</title>

    <style>
        body {
            margin: 0;
            padding: 20px;
            background-color: #f2f2f2;
            font-family: Arial, sans-serif;
        }

        /* En dış çerçeve */
        .container {
            width: 95%;
            margin: auto;
            border: 1px solid white;
            background-color: white;
        }

        /* Üst başlık alanı */
        .header {
            background-color: #2f6690;
            text-align: center;
            padding: 20px;
        }

        .header h1 {
            color: white;
            font-size: 20px;
            margin: 0;
        }

        .header p {
            color: white;
            font-size: 15px;
            margin: 15px 0;
        }

        /* Menü */
        .menu {
            display: flex;
            justify-content: center;
            gap: 5px;
        }

        .menu a {
            background-color: #4a7dae;
            color: white;
            text-decoration: none;
            padding: 8px 12px;
            border-radius: 3px;
            font-size: 10px;
            transition: 0.2s;
        }

        .menu a:hover {
            background-color: #365f86;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="header">

            <h1>Merhaba Ben Ela SAF</h1>

            <p>İç Mimarlık ve Web Tasarımı Öğrencisi</p>

            <div class="menu">
                <a href="#">Hakkımda</a>
                <a href="#">Yeteneklerim</a>
                <a href="#">Derslerim</a>
                <a href="#">İletişim</a>
            </div>

        </div>

    </div>

</body>
</html>
